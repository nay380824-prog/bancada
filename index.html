<style>

body{margin:0;font-family:Urbanist,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
mark{background:#FFE89A;color:#3A2E00;border-radius:4px;padding:0 3px;font-weight:700}
.hide{display:none!important}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:#fff;border:1px solid var(--line);border-radius:24px;padding:32px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:none}
.fld{display:flex;flex-direction:column;gap:6px}
.fld span{font-size:13px;font-weight:700;color:var(--ink2)}
.inp{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:11px 16px;outline:none;width:100%}
.inp:focus{border-color:#B9B5AC}
textarea.inp{border-radius:16px;resize:vertical;line-height:1.5}
.btn{border:0;background:var(--accent);color:#fff;font-weight:700;border-radius:999px;padding:11px 18px}
.btn2{border:1px solid #DDDAD3;background:#fff;color:var(--ink);font-weight:700;border-radius:999px;padding:10px 16px}
.btn-sm{padding:7px 12px;font-size:13px}
.err{color:#A32D2D;font-size:13px;min-height:18px}
/* shell */
#app{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start;padding:20px;min-height:100vh}
nav{flex:1 1 220px;max-width:240px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:20px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;font-weight:800;font-size:18px}
.nav-a{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:999px;color:var(--ink2);font-weight:600;border:1px solid transparent;background:none;text-align:left;width:100%}
.nav-a.on{background:var(--bg);color:var(--ink);font-weight:700;border-color:#DDDAD3}
.nav-a svg{flex:none}
.nav-foot{margin-top:14px;padding:12px 8px 0;border-top:1px solid var(--line2);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:6px}
main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px}
.search-top{position:relative}
.search-top label{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:12px 20px}
.search-top input{flex:1;border:0;outline:none;background:transparent}
.results{position:absolute;left:0;right:0;top:54px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 30px rgba(0,0,0,.08);z-index:20;max-height:60vh;overflow:auto;padding:10px}
.res{display:block;width:100%;text-align:left;border:0;background:var(--soft);border-radius:14px;padding:10px 12px;margin-bottom:6px}
.res small{display:block;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.res b{display:block;font-size:14px;margin:2px 0}
.res span{font-size:13px;color:var(--muted)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding:4px 4px 0}
.head h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.4px}
.head p{margin:2px 0 0;font-size:14px;color:#646A73}
.seg{display:inline-flex;gap:4px;background:#E9E7E2;border-radius:999px;padding:4px;flex-wrap:wrap}
.seg button{border:0;border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;background:transparent;color:#4F555E}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.tag{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px}
.t-msg{color:#1E4E8C;background:#E3EEFB}.t-rev{color:#8A4B00;background:#FDEBD3}.t-cs{color:var(--teal-ink);background:#E1F5EE}
.chip{border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;background:#fff;color:var(--ink);border:1px solid #DDDAD3}

.note{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 18px;font-size:14px;line-height:1.5}

.pd-list{display:flex;flex-direction:column;gap:8px;height:560px;overflow-y:auto;padding-right:4px}
.pd-item{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;border-radius:16px;padding:12px 14px;background:#fff;border:1px solid var(--line2);position:relative}
.pd-item.add{background:#F1F7F5;border-color:#A9D9CB}
.pd-item .tt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700}
.pd-item .pv{font-size:13px;color:var(--muted);line-height:1.45}
.pd-tools{position:absolute;right:10px;top:10px;display:flex;gap:4px}
.ico{border:1px solid var(--line2);background:#fff;border-radius:8px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;padding:0}
.pd-out{background:var(--soft);border:1px solid var(--line2);border-radius:18px;padding:18px 20px;height:520px;overflow-y:auto;line-height:1.6;white-space:pre-wrap}
.pd-out .hf{color:#4F555E}
/* modal */
.ov{position:fixed;inset:0;background:rgba(20,22,26,.4);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal{background:#fff;border-radius:24px;padding:24px;width:100%;max-width:640px;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
/* steps */
.step{display:flex;gap:12px;align-items:flex-start;background:var(--soft);border-radius:16px;padding:12px 14px}
.num{width:26px;height:26px;border-radius:9px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none}
.step b{display:block;font-size:15px;margin-bottom:2px}
.step p{margin:2px 0;font-size:14px;line-height:1.5;color:#2B3038}
abbr{text-decoration:underline dotted var(--teal);text-underline-offset:3px;color:var(--teal-ink);font-weight:700;cursor:help}
.sec-t{font-size:12px;font-weight:800;color:#4F555E;letter-spacing:.04em;margin:6px 0 2px}
/* simulador */
.mny{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:999px;padding:10px 16px}
.mny input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:16px;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px}
.tile small{font-size:12px;font-weight:700;color:var(--muted)}
.tile div{font-size:22px;font-weight:800}
.bar{display:flex;height:40px;border-radius:12px;overflow:hidden}
.bar div{display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;min-width:0}
.calc{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--soft);border-radius:12px;padding:8px 12px}
.box{border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.b-ok{background:#FBF0D9;color:#4A3200;border:1px solid #EBD3A0}
.b-err{background:#FBE4E4;color:#5C1414;border:1px solid #F0B8B8}
.b-off{background:var(--bg);color:var(--ink2);border:1px solid var(--line)}
.b-info{background:#E3EEFB;color:#12345E;border:1px solid #B9D3F2}
@media(max-width:760px){nav{max-width:none;position:static}.tiles{grid-template-columns:1fr}}
</style>
</head>

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function pdItens(){
  var c=PD.canal==='wa'?'wa':'tr';
  return D.textos.filter(function(t){return t.canal===c&&(t.modalidade==='*'||t.modalidade===PD.mod||(t.modalidade==='fd'&&PD.mod==='fin'&&PD.canal==='fd'));});
}
function pdTexto(){
  var ch=D.canais[pdCanalKey()]||{h:'',f:''};
  var adds=PD.add.map(function(id){return D.textos.find(function(t){return t.id===id;});}).filter(Boolean);
  var msg=adds.filter(function(t){return t.tipo==='msg';});
  var junta=function(s){return String(s||'').replace(/\n\s*\n/g,'\n');};
  if(msg.length)return {h:'',b:msg[msg.length-1].texto,f:''};
  return {h:junta(ch.h),b:adds.map(function(t){return t.texto;}).join('\n'),f:junta(ch.f)};

function pdLista(){
  var l=pdItens().filter(function(t){return casa(t.nome+' '+t.texto,PD.q);});
  $('pd-n').textContent=l.length+(l.length===1?' texto':' textos');
  $('pd-list').innerHTML=l.length?l.map(function(t){
    var ad=PD.add.indexOf(t.id)>=0,pv=t.texto.replace(/\n/g,' ');if(pv.length>150)pv=pv.slice(0,150)+'…';
    return '<div class="pd-item'+(ad?' add':'')+'" role="button" tabindex="0" onclick="pdAdd('+t.id+')" onkeydown="if(event.key===\'Enter\')pdAdd('+t.id+')">'+

      '<div class="pv">'+esc(pv)+'</div></div>';
  }).join(''):'<div style="color:var(--muted);font-size:14px;padding:20px">Nada encontrado. Tente outra palavra.</div>';

function pdAdd(id){
  var t=D.textos.find(function(x){return x.id===id;});if(!t)return;
  var k=PD.add.indexOf(id);

  else{PD.add=PD.add.filter(function(j){var x=D.textos.find(function(y){return y.id===j;});return x&&x.tipo!=='msg';});PD.add.push(id);}

var SM={mod:'cs',cv:'890590',av:'887000',disp:'437121.01',tar:'550',fin:'400000',decl:'420000',saldo:'468075.77',iq:true,boleto:'210000',tot:false,dif:'fin'};
function smSet(k,v){SM[k]=v;smCalc();}
function smTog(k,v){SM[k]=v;vSim();}
function vSim(){
  var cs=SM.mod==='cs';
  var campo=function(k,l){return '<label class="fld"><span>'+l+'</span><span class="mny"><span style="color:var(--muted);font-weight:700">R$</span><input type="number" step="0.01" value="'+esc(SM[k])+'" oninput="smSet(\''+k+'\',this.value)"></span></label>';};
  var mini=function(lista,ativo,k){return '<div class="seg" style="align-self:flex-start">'+lista.map(function(b){return '<button class="'+(b[0]===ativo?'on':'')+'" onclick="smTog(\''+k+'\','+JSON.stringify(b[0]).replace(/"/g,"&quot;")+')">'+b[1]+'</button>';}).join('')+'</div>';};
  var h=cab('Simulador do teto do FGTS','Sem cadastrar operação. Serve para financiamento e consórcio.',mini([['fin','Financiamento'],['cs','Consórcio']],SM.mod,'mod'));

  h+=campo('cv','Compra e venda')+campo('av','Avaliação');
  h+=cs?campo('disp','Valor disponível da carta no dia')+campo('tar','Tarifas a descontar'):campo('fin','Valor financiado na proposta')+campo('decl','FGTS informado no formulário');
  h+=campo('saldo','Saldo no extrato do FGTS');
  if(!cs){h+='<div class="fld" style="border-top:1px solid var(--line2);padding-top:14px"><span>Utilização total do FGTS?</span>'+mini([[true,'Sim'],[false,'Não']],SM.tot,'tot')+'</div>';
    if(SM.tot)h+='<div class="fld"><span>Diferença a maior no extrato aplicada no:</span>'+mini([['fin','Financiamento'],['rp','Recursos próprios']],SM.dif,'dif')+'</div>';}
  h+='<div class="fld" style="border-top:1px solid var(--line2);padding-top:14px"><span>Tem Interveniente Quitante?</span>'+mini([[true,'Sim'],[false,'Não']],SM.iq,'iq')+'</div>';
  if(SM.iq)h+=campo('boleto','Saldo devedor do vendedor (boleto do IQ)');
  h+='<span style="font-size:12px;color:var(--muted);line-height:1.5">'+(cs?'MMP 4.1.4 e 3.3.2: a carta ocupa o lugar do financiamento.':'MMP 4.1.4: FGTS + financiamento ≤ menor valor entre compra e venda e avaliação.')+'</span></section>';
  h+='<section id="sm-res" style="flex:2 1 420px;min-width:0;display:flex;flex-direction:column;gap:14px"></section></div>';
  $('view').innerHTML=h;smCalc();
}
function smCalc(){
  var cs=SM.mod==='cs',CV=num(SM.cv),AV=num(SM.av),S=num(SM.saldo),D2=num(SM.decl),F0=num(SM.fin);
  var teto=Math.min(CV,AV),quem=CV<=AV?'compra e venda':'avaliação',P,disp;
  if(cs){P=Math.max(0,num(SM.disp)-num(SM.tar));disp=S;}
  else if(SM.tot&&SM.dif==='fin'){P=Math.max(0,F0-Math.max(0,S-D2));disp=S;}
  else if(SM.tot){P=F0;disp=S;}
  else{P=F0;disp=Math.min(D2,S);}
  var nome=cs?'carta':'financiamento',esp=Math.max(0,teto-P),fg=Math.min(disp,esp),fica=Math.max(0,S-fg),pUsa=Math.min(P,CV),prop=Math.max(0,CV-pUsa-fg);
  var mudou=!cs&&P!==F0;
  var seg=function(parts){var tot=parts.reduce(function(a,x){return a+x.v;},0)||1;return '<div class="bar">'+parts.filter(function(x){return x.v>0;}).map(function(x){return '<div style="flex:'+Math.max(14,x.v/tot*100)+' 1 0;background:'+x.c+';color:'+(x.t||'#fff')+'">'+x.l+' · '+R2(x.v)+'</div>';}).join('')+'</div>';};
  var passo=function(n,t,c,b){return '<div class="card" style="padding:16px 18px;display:flex;flex-direction:column;gap:10px"><div style="display:flex;align-items:center;gap:10px"><span class="num" style="background:var(--bg);border:0">'+n+'</span><b style="font-size:16px">'+t+'</b></div><div class="calc">'+c+'</div>'+(b||'')+'</div>';};
  var h='<div class="tiles"><div class="tile"><small>FGTS no saque</small><div style="color:#3D6E12">'+R2(fg)+'</div><small style="font-weight:500">'+(fica>0?R2(fica)+' ficam na conta':'todo o saldo cabe')+'</small></div>'+
   '<div class="tile"><small>'+(cs?'Carta':'Financiamento')+'</small><div style="color:#0F5E54">'+R2(P)+'</div><small style="font-weight:500">'+(cs?'disponível − tarifas':(mudou?'era '+R2(F0)+' na proposta':'valor financiado'))+'</small></div>'+
   '<div class="tile"><small>Recursos próprios</small><div>'+R2(prop)+'</div><small style="font-weight:500">do bolso do comprador</small></div></div>';
  h+=passo(1,'Qual é o teto?','menor entre compra e venda ('+R2(CV)+') e avaliação ('+R2(AV)+') = '+R2(teto)+' · '+quem);
  h+=passo(2,'Quanto '+(cs?'a carta':'o financiamento')+' ocupa e quanto sobra para o FGTS?',R2(teto)+' − '+R2(P)+' de '+nome+' = '+R2(esp)+' de espaço',seg([{l:cs?'Carta':'Financiamento',v:Math.min(P,teto),c:'#0F6E62'},{l:'Espaço FGTS',v:esp,c:'#B9DC8C',t:'#1F3A05'}]));
  h+=passo(3,'Quanto FGTS entra de fato?',(cs||SM.tot?'saldo ':'FGTS informado ')+R2(disp)+' × espaço '+R2(esp)+' → entra '+R2(fg),seg([{l:'Entra',v:fg,c:'#B9DC8C',t:'#1F3A05'},{l:'Fica na conta',v:fica,c:'#E7A27E',t:'#4A1B0C'}]));
  h+=passo(4,'Quanto sai do bolso?',R2(CV)+' − '+R2(pUsa)+' − '+R2(fg)+' = '+R2(prop));
  if(!cs&&prop<0.005&&fg<S-0.005)h+='<div class="box b-err"><b style="font-size:16px">Sem recursos próprios: tem que usar 100% do FGTS</b><span style="font-weight:600">Vai usar '+R2(fg)+' de um saldo de '+R2(S)+'. Sem dinheiro próprio, o DAMP é rejeitado (518). Use o saldo integral ou complemente com recursos próprios.</span></div>';
  if(mudou)h+='<div class="box b-info"><b style="font-size:16px">O valor financiado muda</b><div class="calc" style="background:rgba(255,255,255,.7)">'+R2(F0)+' − '+R2(Math.max(0,S-D2))+' de diferença no extrato = '+R2(P)+'</div><span style="font-weight:600">A operação volta para todas as áreas (documental e crédito) para ajustar o valor do financiamento.</span></div>';
  if(SM.iq){
    var B=num(SM.boleto),aplica=cs||fg>0,cobre=pUsa>=B,ok=!aplica||cobre;
    var msg=!aplica?'Sem FGTS nesta operação: o aviso FGTS + IQ não se aplica.':(cobre?'Cobre o saldo devedor. Sobram '+R2(Math.max(0,pUsa-B))+' de '+nome+' para o vendedor.':(cs?'Não cobre: faltam '+R2(B-pUsa)+' de carta. FGTS e recursos próprios não podem completar o boleto.':'Não cobre: faltam '+R2(B-pUsa)+'. O financiamento precisa ser igual ou maior que o saldo devedor, e o FGTS não pode complementar a liquidação.'));
    h+='<div class="box '+(!aplica?'b-off':(ok?'b-ok':'b-err'))+'"><b style="font-size:16px">'+(cs?'Regra do IQ: o boleto é pago só com a carta':'Regra FGTS + IQ: o financiamento cobre o saldo devedor')+'</b><div class="calc" style="background:rgba(255,255,255,.7)">'+R2(pUsa)+' de '+nome+(cobre?' ≥ ':' < ')+R2(B)+' de saldo devedor</div><span style="font-weight:700">'+msg+'</span>'+
     '<span style="font-size:13px;font-weight:700;margin-top:4px">Para onde vai o dinheiro</span>'+seg([{l:'Banco do IQ',v:Math.min(B,pUsa),c:'#0F6E62'},{l:'Falta '+nome,v:Math.max(0,B-pUsa),c:'#B3261E'},{l:'Vendedor ('+(cs?'carta':'financ.')+')',v:Math.max(0,pUsa-B),c:'#2E8C80'},{l:'Vendedor (FGTS)',v:fg,c:'#B9DC8C',t:'#1F3A05'},{l:'Vendedor (próprios)',v:prop,c:'#5F5E5A'}])+'</div>';
  }
  if(P>=teto)h+='<div class="box b-ok" style="background:#FDEBD3;border-color:#F3C99A;color:#6B3A00;font-weight:600">O '+nome+' já ocupa o teto inteiro: não cabe FGTS nesta operação.</div>';
  else if(fica>0)h+='<div class="box b-ok" style="background:#FDEBD3;border-color:#F3C99A;color:#6B3A00;font-weight:600">'+R2(fica)+' de FGTS ficam fora desta operação e permanecem na conta vinculada.</div>';
  $('sm-res').innerHTML=h;
}

   '<section class="card" style="margin-top:16px;display:flex;flex-direction:column;gap:14px"><b style="font-size:18px">Qual certificado usar?</b><div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">'+qs+
   (rc?'<div style="border-radius:18px;padding:8px 16px;background:'+rc.b+';color:'+rc.c+'"><small style="display:block;font-weight:700">Usar</small><b style="font-size:20px">'+rc.t+'</b></div>':'')+

     return '<section style="background:#fff;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:6px;border:'+(on?'2px solid '+c.c:'1px solid var(--line)')+';opacity:'+(res&&!on?'.55':'1')+'">'+
      '<b style="font-size:20px">'+c.t+'</b><span style="align-self:flex-start;font-size:13px;font-weight:600;color:'+c.c+';background:'+c.b+';border-radius:999px;padding:3px 10px">"'+c.apel+'"</span>'+
      '<small style="font-weight:700;color:#4F555E;margin-top:6px">Como emite</small>'+c.como.map(function(x,i){return '<span style="font-size:14px">'+(i+1)+'. '+esc(x)+'</span>';}).join('')+
      '<small style="font-weight:700;color:#4F555E;margin-top:6px">Melhor quando</small>'+c.melhor.map(function(x){return '<span style="font-size:14px">· '+esc(x)+'</span>';}).join('')+
      '<small style="font-weight:700;color:#4F555E;margin-top:6px">Pesa contra</small><span style="font-size:14px">'+esc(c.contra)+'</span></section>';}).join('')+'</div>'+
   '<div class="note" style="margin-top:16px"><b>Validade:</b> o certificado emitido na Uniproof vale 1 ano.</div>';
}

/* ====== ASSISTENTE ====== */
var IA={modo:'txt',destino:'email',texto:'',res:null,carregando:false,erro:'',teste:''};
var IA_BLOQ=[[/\b\d{3}\.?\d{3}\.?\d{3}-?\d{2}\b/,'CPF'],[/\b\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}\b/,'CNPJ'],[/[\w.+-]+@[\w-]+\.[\w.-]+/,'e-mail'],[/(\(?\b\d{2}\)?\s?)?\b9?\d{4}-?\d{4}\b/,'telefone'],[/matr[ií]cula\s*(n[º°o.]*\s*)?\d/i,'número de matrícula']];
function iaBloqueio(t){for(var i=0;i<IA_BLOQ.length;i++)if(IA_BLOQ[i][0].test(t))return IA_BLOQ[i][1];return null;}
async function iaChamar(body){
  var t=await token();
  var r=await fetch(SB_URL+'/functions/v1/assistente',{method:'POST',headers:{'Authorization':'Bearer '+t,'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  var d={};try{d=await r.json();}catch(e){}
  if(!r.ok)throw new Error(d.erro||d.message||('Erro '+r.status+(r.status===404?': a função "assistente" ainda não foi criada no Supabase.':'')));
  return d;
}
async function iaTestar(){
  IA.teste='Testando...';vIA();
  try{var d=await iaChamar({modo:'teste'});IA.teste='✓ Conexão funcionando ('+d.modelo+' respondeu "'+d.resposta+'").';}
  catch(e){IA.teste='✗ '+e.message;}
  vIA();
}
async function iaEnviar(){
  IA.texto=$('ia-txt').value;IA.erro='';IA.res=null;
  if(!IA.texto.trim()){IA.erro='Cole o texto antes de enviar.';vIA();return;}
  var b=iaBloqueio(IA.texto);
  if(b){IA.erro='O texto parece ter '+b+'. Troque por um campo como [NOME] ou [CPF] antes de enviar.';vIA();return;}
  IA.carregando=true;vIA();
  try{IA.res=await iaChamar({modo:'texto',texto:IA.texto,destino:IA.destino});}
  catch(e){IA.erro=e.message;}
  IA.carregando=false;vIA();
}
function iaModo(m){IA.modo=m;vIA();}
function iaDest(d){IA.texto=$('ia-txt')?$('ia-txt').value:IA.texto;IA.destino=d;vIA();}
function vIA(){
  var h=cab('Assistente','Textos e dúvidas sem precisar passar pelo celular.',segHtml([['txt','Melhorar texto'],['duv','Tirar dúvida']],IA.modo,'iaModo'));
  if(IA.modo==='duv'){
    h+='<section class="card" style="margin-top:16px;line-height:1.6"><b style="font-size:18px">Em construção</b><p style="color:var(--muted)">A consulta com base na legislação precisa que as leis sejam carregadas e divididas em trechos no banco. É a próxima etapa.</p></section>';
  } else {
    h+='<div class="row" style="margin-top:16px;align-items:stretch">'+
     '<section class="card" style="flex:1 1 400px;min-width:0;display:flex;flex-direction:column;gap:12px"><b style="font-size:18px">Seu rascunho</b>'+
     '<span style="font-size:13px;color:var(--muted)">Cole o texto do jeito que está. Use [NOME] no lugar de dados do cliente.</span>'+
     '<textarea class="inp" id="ia-txt" rows="12" placeholder="Cole aqui o rascunho do e-mail ou da pendência">'+esc(IA.texto)+'</textarea>'+
     '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center"><b style="font-size:13px;color:var(--ink2)">Para:</b>'+
       [['email','E-mail'],['whatsapp','WhatsApp'],['pendencia','Pendência formal']].map(function(x){return '<button class="chip'+(IA.destino===x[0]?' on':'')+'" onclick="iaDest(\''+x[0]+'\')">'+x[1]+'</button>';}).join('')+'</div>'+
     (IA.erro?'<div class="box b-err" style="padding:10px 14px;font-weight:600;font-size:14px">'+esc(IA.erro)+'</div>':'')+
     '<button class="btn" style="align-self:flex-start" onclick="iaEnviar()"'+(IA.carregando?' disabled':'')+'>'+(IA.carregando?'Melhorando...':'Melhorar texto')+'</button></section>'+
     '<section class="card" style="flex:1 1 400px;min-width:0;display:flex;flex-direction:column;gap:12px"><b style="font-size:18px">Texto revisado</b>'+
     (IA.res?'<div class="pd-out" style="height:auto;min-height:220px">'+marcar(IA.res.texto)+'</div>'+
       (IA.res.mudancas?'<div style="background:var(--soft);border-radius:14px;padding:10px 14px;font-size:13px;white-space:pre-wrap"><b style="display:block;font-size:12px;color:#4F555E;margin-bottom:2px">O QUE MUDOU</b>'+esc(IA.res.mudancas)+'</div>':'')+
       '<button class="btn2" style="align-self:flex-start" id="ia-copy" onclick="copiar(limparCopia(IA.res.texto),this)">Copiar texto</button>'
      :'<div style="color:var(--muted);font-size:14px;padding:30px 10px;text-align:center">O texto revisado aparece aqui.</div>')+
     '</section></div>';
  }
  h+='<div class="note" style="margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between"><span>'+(IA.teste?esc(IA.teste):'Primeira vez? Teste se a Bancada consegue falar com a IA.')+'</span><button class="btn2 btn-sm" onclick="iaTestar()">Testar conexão</button></div>';
  $('view').innerHTML=h;
}

/* ====== INTERMEDIAÇÃO ====== */
var IN={tab:'iq',path:'gpo'};
var RXSIG=null;
function sigRx(){if(RXSIG)return RXSIG;var ks=Object.keys(D.inter.sig).sort(function(a,b){return b.length-a.length;}).map(function(k){return k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');});RXSIG=new RegExp('(^|[^A-Za-z0-9])('+ks.join('|')+')(?![A-Za-z0-9])','g');return RXSIG;}
function comSiglas(txt,usadas){
  var rx=sigRx(),out='',last=0,m;rx.lastIndex=0;
  while((m=rx.exec(txt))){var st=m.index+m[1].length;out+=esc(txt.slice(last,st))+'<abbr title="'+esc(D.inter.sig[m[2]])+'">'+esc(m[2])+'</abbr>';usadas[m[2]]=1;last=st+m[2].length;}
  return out+esc(txt.slice(last));
}
function passosHtml(lista,start,usadas){
  return lista.map(function(s,i){
    return '<div class="step"><span class="num">'+(start+i+1)+'</span><div style="min-width:0;display:flex;flex-direction:column;gap:4px"><b>'+comSiglas(s.t,usadas)+'</b>'+
      s.d.map(function(l){return '<p>'+comSiglas(l,usadas)+'</p>';}).join('')+
      (s.code?'<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span class="code">'+comSiglas(s.code,usadas)+'</span><button class="btn2 btn-sm" onclick="copiar('+esc(JSON.stringify(s.code))+',this)">Copiar</button></div>':'')+'</div></div>';
  }).join('');
}
function vInt(){
  if(!D.inter){$('view').innerHTML=cab('Roteiros da intermediação','')+'<div class="note" style="margin-top:16px">Conteúdo não encontrado no banco. Rode o SQL da Bancada.</div>';return;}
  var I=D.inter,us={},h='';
  if(IN.tab==='iq'){
    var P=I.iqPaths[IN.path],a=I.iqIni.length,b=P.steps.length;
    h+='<div class="sec-t">ANTES DE TUDO</div>'+passosHtml(I.iqIni,0,us)+'<div class="sec-t">'+esc(P.n.toUpperCase())+'</div>'+passosHtml(P.steps,a,us)+'<div class="sec-t">PARA TODOS OS CAMINHOS</div>'+passosHtml(I.iqFim,a+b,us);
  } else h+=passosHtml(I[IN.tab],0,us);
  var sig=Object.keys(us).sort();
  $('view').innerHTML=cab('Roteiros da intermediação','Só o passo a passo. Uma fonte única para consultar e para treinar.')+
   '<div style="margin-top:16px">'+segHtml([['port','Portabilidade'],['cert','Certificação'],['iq','Interveniente Quitante'],['fgts','FGTS']],IN.tab,'inTab')+'</div>'+
   (IN.tab==='iq'?'<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px"><b style="font-size:13px;color:var(--ink2)">Caminho do IQ:</b>'+I.pathOrder.map(function(k){return '<button class="chip'+(IN.path===k?' on':'')+'" onclick="IN.path=\''+k+'\';vInt()">'+esc(I.iqPaths[k].n)+'</button>';}).join('')+'</div>':'')+
   '<div class="row" style="margin-top:16px"><section class="card" style="flex:2 1 480px;min-width:0;display:flex;flex-direction:column;gap:10px">'+h+'</section>'+
   '<aside class="card" style="flex:1 1 260px;max-width:340px;display:flex;flex-direction:column;gap:8px"><b style="font-size:16px">Siglas desta aba</b><span style="font-size:12px;color:var(--muted)">No texto, passe o mouse na sigla sublinhada.</span>'+
   sig.map(function(k){return '<div style="background:var(--soft);border-radius:12px;padding:8px 12px"><b style="font-size:13px;color:var(--teal-ink);display:block">'+esc(k)+'</b><span style="font-size:12px;line-height:1.45;color:var(--ink2)">'+esc(I.sig[k])+'</span></div>';}).join('')+'</aside></div>';
}
function inTab(t){IN.tab=t;vInt();}

/* ====== NOTAS ====== */
function notasPend(){return (D.notas||[]).filter(function(n){return !n.feito;}).length;}
async function notaAdd(){
  var i=$('nota-in'),txt=(i.value||'').trim();if(!txt)return;
  i.value='';
  try{var r=await db('notas',{method:'POST',body:JSON.stringify({texto:txt})});if(r&&r[0])D.notas.unshift(r[0]);}
  catch(e){alert('Não consegui salvar a nota. A tabela "notas" já foi criada no Supabase?');i.value=txt;return;}
  renderNav();vNotas();
}
async function notaFeita(id,v){
  var n=D.notas.find(function(x){return x.id===id;});if(!n)return;
  n.feito=v;n.feito_em=v?new Date().toISOString():null;renderNav();vNotas();
  try{await db('notas?id=eq.'+id,{method:'PATCH',body:JSON.stringify({feito:v,feito_em:n.feito_em})});}catch(e){}
}
async function notaDel(id){
  if(!confirm('Apagar esta nota?'))return;
  D.notas=D.notas.filter(function(x){return x.id!==id;});renderNav();vNotas();
  try{await db('notas?id=eq.'+id,{method:'DELETE'});}catch(e){}
}
function notaCopiar(btn){
  var p=D.notas.filter(function(n){return !n.feito;}).slice().reverse();
  copiar('Ajustes pendentes na Bancada:\n'+p.map(function(n,i){return (i+1)+'. '+n.texto;}).join('\n'),btn);
}
function vNotas(){
  var pend=D.notas.filter(function(n){return !n.feito;}),feitas=D.notas.filter(function(n){return n.feito;});
  var linha=function(n){var d=new Date(n.criado_em);return '<div style="display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:14px;padding:10px 14px'+(n.feito?';opacity:.6':'')+'">'+
    '<input type="checkbox" style="margin-top:4px;width:16px;height:16px"'+(n.feito?' checked':'')+' onchange="notaFeita('+n.id+',this.checked)" aria-label="Marcar como ajustada">'+
    '<div style="flex:1;min-width:0"><div style="font-size:14px;line-height:1.5;white-space:pre-wrap'+(n.feito?';text-decoration:line-through':'')+'">'+esc(n.texto)+'</div><small style="color:var(--muted)">'+d.toLocaleDateString('pt-BR')+'</small></div>'+
    '<button class="ico" title="Apagar" aria-label="Apagar" onclick="notaDel('+n.id+')">×</button></div>';};
  var h=cab('Notas','Anote o que precisa ajustar na Bancada. Em casa, copie e cole no chat para ajustarmos juntos.');
  if(!D.notasOk){$('view').innerHTML=h+'<div class="note" style="margin-top:16px">A tabela de notas ainda não existe. Rode o SQL das notas no Supabase.</div>';return;}
  h+='<section class="card" style="margin-top:16px;display:flex;flex-direction:column;gap:10px">'+
    '<div style="display:flex;gap:8px"><input class="inp" id="nota-in" placeholder="Ex.: na pendência de procuração, faltou citar os poderes..." onkeydown="if(event.key===\'Enter\')notaAdd()"><button class="btn" onclick="notaAdd()">Anotar</button></div>'+
    (pend.length?'<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><b style="font-size:15px">Pendentes · '+pend.length+'</b><button class="btn2 btn-sm" onclick="notaCopiar(this)">Copiar pendentes</button></div>'+pend.map(linha).join(''):'<div style="color:var(--muted);font-size:14px;padding:10px 4px">Nenhuma nota pendente.</div>')+
    (feitas.length?'<details style="margin-top:6px"><summary style="cursor:pointer;font-weight:700;font-size:14px;color:var(--muted)">Ajustadas · '+feitas.length+'</summary><div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">'+feitas.map(linha).join('')+'</div></details>':'')+
    '</section>';
  $('view').innerHTML=h;
  var i=$('nota-in');if(i)i.focus();
}

/* ====== BUSCA GERAL ====== */
function buscar(q){
  var box=$('results');if(semAc(q).trim().length<2){box.classList.add('hide');return;}
  var hits=[];
  D.textos.forEach(function(t){if(casa(t.nome+' '+t.texto,q))hits.push({g:'Pendência · '+(t.canal==='wa'?'WhatsApp':'Tradicional'),t:t.nome,s:t.texto,go:function(){PD.q=q;PD.mod=t.modalidade==='cs'?'cs':'fin';PD.canal=t.canal==='wa'?'wa':(t.modalidade==='fd'?'fd':'tr');ir('pend');}});});
  if(D.inter){var I=D.inter,add=function(tab,path,s,rot){if(casa(s.t+' '+s.d.join(' ')+' '+(s.code||''),q))hits.push({g:'Intermediação · '+rot,t:s.t,s:s.d.join(' '),go:function(){IN.tab=tab;if(path)IN.path=path;ir('int');}});};
    [['port','Portabilidade'],['cert','Certificação'],['fgts','FGTS']].forEach(function(x){I[x[0]].forEach(function(s){add(x[0],null,s,x[1]);});});
    I.iqIni.concat(I.iqFim).forEach(function(s){add('iq',null,s,'IQ');});
    Object.keys(I.iqPaths).forEach(function(k){I.iqPaths[k].steps.forEach(function(s){add('iq',k,s,'IQ · '+I.iqPaths[k].n);});});}
  CONS_TOP.forEach(function(t,i){if(casa(t.t+' '+t.ideia+' '+t.pts.join(' '),q))hits.push({g:'Consórcio',t:t.t,s:t.ideia,go:function(){CS.i=i;ir('cons');}});});
  CERTS.forEach(function(c){if(casa(c.t+' '+c.como.join(' ')+' '+c.melhor.join(' ')+' '+c.contra,q))hits.push({g:'Certificados',t:c.t,s:c.melhor.join(' · '),go:function(){ir('cert');}});});
  window._hits=hits.slice(0,30);
  box.innerHTML=window._hits.length?window._hits.map(function(h,i){var s=h.s.replace(/\s+/g,' ');if(s.length>140)s=s.slice(0,140)+'…';return '<button class="res" onclick="abrirHit('+i+')"><small>'+esc(h.g)+'</small><b>'+esc(h.t)+'</b><span>'+esc(s)+'</span></button>';}).join(''):'<div style="padding:12px;color:var(--muted)">Nada encontrado.</div>';
  box.classList.remove('hide');
}
function abrirHit(i){var h=window._hits[i];$('results').classList.add('hide');$('q-geral').value='';h.go();}
$('q-geral').oninput=function(){buscar(this.value);};
$('q-geral').onkeydown=function(e){if(e.key==='Escape'){this.value='';$('results').classList.add('hide');}};
document.addEventListener('click',function(e){if(!e.target.closest('.search-top'))$('results').classList.add('hide');});
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('q-geral').focus();}if(e.key==='Escape')fecharModal();});

async function iniciar(){
  $('login').classList.add('hide');$('app').classList.remove('hide');
  $('who').textContent=sessao.email||'';
  $('view').innerHTML='<div class="note">Carregando...</div>';
  try{atual=localStorage.getItem('bancada_mod')||'pend';}catch(e){}
  renderNav();
  try{await carregar();render();}
  catch(e){if(/sessão|sem sessão/.test(e.message)){sair();return;}$('view').innerHTML='<div class="note">Não consegui carregar os dados: '+esc(e.message)+'</div>';}
}
(function(){sessao=lerSessao();if(sessao)iniciar();else mostrarLogin();})();
